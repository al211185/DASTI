# ================================================================
# Despliega la carpeta backend/ a Azure App Service (Linux)
# ================================================================
name: Build & Deploy – backend to Azure App Service

on:
  push:
    branches: [ azure ]
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'

jobs:
# ----------------------------------------------------------------
# 1. BUILD: prepara release.zip con SOLO backend/
# ----------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm ci (backend)
        run: npm ci --omit=dev
        working-directory: backend

      - name: npm run build --if-present
        run: npm run build --if-present
        working-directory: backend

      - name: Zip backend
        run: |
          cd backend
          zip -r ../release.zip . -x "node_modules/**"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: release.zip

# ----------------------------------------------------------------
# 2. DEPLOY: sube release.zip directamente
# ----------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-release

      # --- LOGIN -------------------------------------------------
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id:      ${{ secrets.AZUREAPPSERVICE_CLIENTID_3BFB266ECF534E6AB798F9A0FBOE3B23 }}
          tenant-id:      ${{ secrets.AZUREAPPSERVICE_TENANTID_E60A0A20082140A483462EA2595C2C7E }}
          subscription-id:${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1BAE8BF160C0455782CDA2BD7931FF9A }}

      # --- DEPLOY ------------------------------------------------
      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: DastiApp
          slot-name: Production
          package: release.zip        # <-- Publica el ZIP; NO se descomprime localmente
