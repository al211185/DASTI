
name: Build & Deploy – backend to Azure App Service

on:
  push:
    branches: [ azure ]          # se ejecuta al hacer push a la rama azure
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'           # versión Node en App Service

# ----------------------------------------------------------------
# 1. BUILD – genera backend.zip con el contenido de backend/
# ----------------------------------------------------------------
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm ci (backend)
        run: npm ci --omit=dev
        working-directory: backend

      - name: npm run build --if-present
        run: npm run build --if-present
        working-directory: backend

      # Empaquetar *dentro* de backend/ (raíz del ZIP)
      - name: Zip backend
        run: |
          cd backend
          zip -r ../backend.zip . -x "node_modules/**"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: backend.zip            # ← artefacto que subiremos

# ----------------------------------------------------------------
# 2. DEPLOY – publica backend.zip directamente en el Web App
# ----------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-release

      # ---------- LOGIN A AZURE ----------
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id:      ${{ secrets.AZUREAPPSERVICE_CLIENTID_3BFB266ECF534E6AB798F9A0FBOE3B23 }}
          tenant-id:      ${{ secrets.AZUREAPPSERVICE_TENANTID_E60A0A20082140A483462EA2595C2C7E }}
          subscription-id:${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1BAE8BF160C0455782CDA2BD7931FF9A }}

      # ---------- DEPLOY ----------
      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: DastiApp          # nombre EXACTO del recurso en Azure
          slot-name: Production
          package: backend.zip        # ← publica el ZIP tal cual
