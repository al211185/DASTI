# ================================================================
# Despliega la carpeta backend/ a Azure App Service (Linux)
# ================================================================
name: Build & Deploy – backend to Azure App Service

on:
  push:
    branches: [ azure ]           # se ejecuta cuando hagas push a la rama azure
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'            # cambia aquí si algún día saltas a otra LTS

jobs:
# ----------------------------------------------------------------
# 1. BUILD: instala deps del backend y genera release.zip
# ----------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Instala solo dependencias de producción en backend/
      - name: npm ci (backend)
        run: npm ci --omit=dev
        working-directory: backend

      # Build opcional (si no tienes script build no pasa nada)
      - name: npm run build --if-present
        run: npm run build --if-present
        working-directory: backend

      # Empaquetar backend/ excluyendo node_modules
      - name: Zip artifact
        run: |
          cd backend
          zip -r ../release.zip . -x "node_modules/**"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: release.zip

# ----------------------------------------------------------------
# 2. DEPLOY: publica release.zip en tu App Service
# ----------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-release

      - name: Unzip artifact
        run: unzip release.zip

      # --- LOGIN -------------------------------------------------
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id:      ${{ secrets.AZUREAPPSERVICE_CLIENTID_3BFB266ECF534E6AB798F9A0FBOE3B23 }}
          tenant-id:      ${{ secrets.AZUREAPPSERVICE_TENANTID_E60A0A20082140A483462EA2595C2C7E }}
          subscription-id:${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1BAE8BF160C0455782CDA2BD7931FF9A }}

      # --- DEPLOY ------------------------------------------------
      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: DastiApp          # nombre EXACTO del recurso en Azure
          slot-name: Production
          package: .
